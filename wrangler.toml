name = "krill-bill"
main = "src/api-server/index.ts"
compatibility_date = "2026-09-01"

# Optional cloud contact sync — create a namespace, then uncomment:
#   wrangler kv namespace create CONTACTS_KV
#   wrangler kv namespace create CONTACTS_KV --preview
# [[kv_namespaces]]
# binding = "CONTACTS_KV"
# id = "<production-namespace-id>"
# preview_id = "<preview-namespace-id>"

[assets]
not_found_handling = "single-page-application"

run_worker_first = ["/api/*", "/health", "/health/*"]

[vars]
ENVIRONMENT = "development"

[env.production]
name = "krill-bill"
vars = { ENVIRONMENT = "production" }

[env.staging]
name = "krill-bill-staging"
vars = { ENVIRONMENT = "staging" }
